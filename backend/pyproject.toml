[project]
name = "bedrock-converse-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.38",
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.34",
    "mangum>=0.19",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.1",
    "pytest-asyncio>=0.25",
    "moto[bedrock]>=5.1",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.8",
    "semgrep>=1.100",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "C4", "PIE", "RET", "SIM", "TCH"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.bandit]
skips = ["B101"]
