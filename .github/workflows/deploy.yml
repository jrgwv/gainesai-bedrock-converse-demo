name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: CDK deploy to prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install backend deps
        run: pip install uv && cd backend && uv sync --frozen

      - name: Install infra deps
        run: cd infra && npm ci

      - name: CDK diff
        run: cd infra && npx cdk diff --context env=prod

      - name: CDK deploy
        run: cd infra && npx cdk deploy --context env=prod --require-approval never

      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name BedrockConverse-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          curl -sf "${API_URL}health" | jq .
